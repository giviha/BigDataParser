name: bigdata-parser
x-agent: &agent
  image: bigdata-parser-agent:local
  build: {context: ., target: agent}
  volumes:
    - logs:/logs:ro
  depends_on:
    collector:
      condition: service_started

x-source: &source
  profiles: [source]
  volumes:
    - logs:/logs

services:
  clickhouse:
    image: bigdata-parser-clickhouse:local
    build: {context: ., dockerfile: Dockerfile.clickhouse}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: demo-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: UTC
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: [CMD, clickhouse-client, --password, demo-local, --query, "SELECT 1 FROM logs LIMIT 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  collector:
    image: bigdata-parser-collector:local
    build: {context: ., target: collector}
    command: ["-clickhouse", "http://default:demo-local@clickhouse:8123/?wait_end_of_query=1"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      clickhouse:
        condition: service_healthy

  source-alpine:
    <<: *source
    build: {context: ., target: source-alpine}
  source-debian:
    <<: *source
    build: {context: ., target: source-debian}
  source-ubuntu:
    <<: *source
    build: {context: ., target: source-ubuntu}

  agent-01:
    <<: *agent
    profiles: [lab]
    command: ["-name", "agent-01", "-file", "/logs/01.log", "-source", "json"]

  agent-02:
    <<: *agent
    profiles: [lab]
    command: ["-name", "agent-02", "-file", "/logs/02.log", "-source", "syslog"]

  agent-03:
    <<: *agent
    profiles: [lab]
    command: ["-name", "agent-03", "-file", "/logs/03.log", "-source", "nginx"]

  agent-04:
    <<: *agent
    profiles: [lab]
    command: ["-name", "agent-04", "-file", "/logs/04.log", "-source", "json"]

  agent-05:
    <<: *agent
    profiles: [lab]
    command: ["-name", "agent-05", "-file", "/logs/05.log", "-source", "syslog"]

